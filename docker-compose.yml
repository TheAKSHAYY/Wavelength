services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - wavelength-data:/app/data
    restart: unless-stopped
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - server
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  wavelength-data:
